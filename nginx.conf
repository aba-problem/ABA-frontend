server {
    listen 80;
    server_name aba.andrescortes.dev;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Security headers (Módulo 5.6) ──────────────────────────────────
    # El TLS lo termina el proxy externo; estos headers se añaden a la
    # respuesta antes de que llegue al navegador sobre HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://api.aba.andrescortes.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively (Vite hashes filenames).
    # Los add_header se repiten aquí: en nginx, si un location declara
    # add_header, NO hereda los del server.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://api.aba.andrescortes.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Archivos estáticos reales (robots.txt, sitemap.xml, .well-known/*):
    # si existen se sirven tal cual; si no, el fallback @spa devuelve 404
    # genuino en vez de index.html (los crawlers/auditores no deben ver
    # "200 OK" en rutas que no existen).
    location / {
        try_files $uri $uri/ @spa;
    }

    # Fallback SPA: sirve index.html SOLO para rutas de la app sin extensión
    # (/login, /dashboard, /auth/success, ...). Cualquier ruta que parezca
    # un archivo (robots.txt, sitemap.xml, /.well-known/security.txt, foo.js)
    # y no exista devuelve 404.
    location @spa {
        if ($uri ~* "\.[a-z0-9]{1,12}$") {
            return 404;
        }
        rewrite ^ /index.html break;
    }
}
